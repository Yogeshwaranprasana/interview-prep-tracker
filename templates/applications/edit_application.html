{% extends 'base.html' %}

{% block content %}

<h1 class="mb-4">
    Edit Application
</h1>

<form method="POST">

    {% csrf_token %}

    <div class="mb-3">

        <input
            type="text"
            name="company_name"
            class="form-control"
            value="{{ application.company_name }}"
        >

    </div>

    <div class="mb-3">

        <input
            type="text"
            name="job_role"
            class="form-control"
            value="{{ application.job_role }}"
        >

    </div>

    <div class="mb-3">
        <select name="status" class="form-control">
            <option value="Pending" {% if application.status == 'Pending' %}selected{% endif %}>Pending</option>
            <option value="Selected" {% if application.status == 'Selected' %}selected{% endif %}>Selected</option>
            <option value="Rejected" {% if application.status == 'Rejected' %}selected{% endif %}>Rejected</option>
        </select>
    </div>

    <div class="mb-3">

        <input
            type="date"
            name="applied_date"
            class="form-control"
            value="{{ application.applied_date|date:'Y-m-d' }}"
        >

    </div>

    <button class="btn btn-info">

        Update Application

    </button>

</form>

{% endblock %}
