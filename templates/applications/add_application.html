{% extends 'base.html' %}

{% block content %}

<h1 class="mb-4">
    Add Application
</h1>

<form method="POST">

    {% csrf_token %}

    <div class="mb-3">
        <input
            type="text"
            name="company_name"
            class="form-control"
            placeholder="Company Name"
            required
        >
    </div>

    <div class="mb-3">
        <input
            type="text"
            name="job_role"
            class="form-control"
            placeholder="Job Role"
            required
        >
    </div>

    <div class="mb-3">
        <select name="status" class="form-control" required>
            <option value="Pending">Pending</option>
            <option value="Selected">Selected</option>
            <option value="Rejected">Rejected</option>
        </select>
    </div>

    <div class="mb-3">
        <input
            type="date"
            name="applied_date"
            class="form-control"
            required
        >
    </div>

    <button class="btn btn-info">
        Save Application
    </button>

</form>

{% endblock %}
