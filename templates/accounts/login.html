{% extends 'auth_base.html' %}

{% block content %}

<div class="d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="card bg-dark text-white p-5 shadow rounded" style="width: 100%; max-width: 400px;">
        <h2 class="text-center mb-4 text-info">Login</h2>
        
        <form method="POST" autocomplete="off">
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label text-white">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter your username" autocomplete="new-password" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label text-white">Password</label>
                <input type="password" name="password" class="form-control" placeholder="Enter your password" autocomplete="new-password" required>
            </div>
            
            <button type="submit" class="btn btn-info w-100 py-2 mb-3">Login</button>
        </form>
        
        <hr class="text-muted">
        
        <p class="text-center text-secondary mb-0">
            Don't have an account? 
            <a href="{% url 'register' %}" class="text-info" style="text-decoration: none; font-weight: bold;">
                Register here
            </a>
        </p>
    </div>
</div>

{% endblock %}
