{% extends 'base.html' %}

{% block content %}

<div class="mb-4">
    <a href="{% url 'dashboard' %}" class="btn btn-secondary">Dashboard</a>
</div>

<h1 class="mb-4">Edit Skill</h1>

<form method="POST">
    {% csrf_token %}

    <div class="mb-3">
        <input type="text" name="name" class="form-control" value="{{ skill.name }}" required>
    </div>

    <div class="mb-3">
        <input type="text" name="category" class="form-control" value="{{ skill.category }}" required>
    </div>

    <div class="mb-3">
        <select name="level" class="form-control" required>
            <option value="Beginner" {% if skill.level == 'Beginner' %}selected{% endif %}>Beginner</option>
            <option value="Intermediate" {% if skill.level == 'Intermediate' %}selected{% endif %}>Intermediate</option>
            <option value="Advanced" {% if skill.level == 'Advanced' %}selected{% endif %}>Advanced</option>
            <option value="Expert" {% if skill.level == 'Expert' %}selected{% endif %}>Expert</option>
        </select>
    </div>

    <button class="btn btn-info">Update Skill</button>
</form>

{% endblock %}
