<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Interview Tracker</title>

    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

    .card {

        transition: 0.3s;

    }

    .card:hover {

        transform: translateY(-5px);

    }

</style>

</head>

<body style="background-color:#0F172A; color:white;">

<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->

        <div class="col-md-2 bg-dark vh-100 p-4">

            <h3 class="text-info mb-4">
                Tracker
            </h3>

            <ul class="nav flex-column">

                <li class="nav-item mb-3">
                    <a href="/dashboard/" class="nav-link text-white">
                        Dashboard
                    </a>
                </li>

                <li class="nav-item mb-3">
                   <a href="/add-application/" class="nav-link text-white">
                      Applications
                    </a>  
                </li>

                <li class="nav-item mb-3">
                    <a href="/skills/" class="nav-link text-white">
                        Skills
                    </a>
                </li>

                <li class="nav-item mb-3">
                    <a href="/notes/" class="nav-link text-white">
                        Notes
                    </a>
                </li>

                <li class="nav-item mb-3">
                    <a href="/resumes/" class="nav-link text-white">
                        Resumes
                    </a>
                </li>

                <li class="nav-item mb-3">
                    <a href="/logout/" class="nav-link text-danger">
                        Logout
                    </a>
                </li>

            </ul>

        </div>

        <!-- Main Content -->

        <div class="col-md-10 p-5">

            {% block content %}

            {% endblock %}

        </div>

    </div>

</div>

</body>
</html>
