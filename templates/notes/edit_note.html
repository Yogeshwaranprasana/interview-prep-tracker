{% extends 'base.html' %}

{% block content %}

<div class="mb-4">
    <a href="{% url 'dashboard' %}" class="btn btn-secondary">Dashboard</a>
</div>

<h1 class="mb-4">Edit Note</h1>

<form method="POST">
    {% csrf_token %}

    <div class="mb-3">
        <label class="form-label text-white">Question</label>
        <input type="text" name="title" class="form-control" value="{{ note.title }}" required>
    </div>

    <div class="mb-3">
        <label class="form-label text-white">Answer</label>
        <textarea name="body" class="form-control" rows="8" required>{{ note.body }}</textarea>
    </div>

    <button class="btn btn-info">Update Note</button>
</form>

{% endblock %}
